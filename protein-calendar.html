<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Protein Calendar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body ::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image: url("high-protein.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 400px;

            opacity: 0.02;

            pointer-events: none;
            z-index: -1;
        }
    </style>
    
</head>
<body>

<h1 id="welcome"></h1>
<h2 id="welcome2"></h2>

<h3>Protein qo'shish</h3>

<input type="date" class="date-consumed">
<input type="number" class="protein-gram" placeholder=" Protein (g)">
<button class="protein-add-button">Qo'shish</button>

<div class="box-result">
    <h3>Bugungi data</h3>
    <div class="result"></div>

    <button class="clear-button">Tozalash</button>
</div>



<a href="protein-calendar2.html" class="link-html">📅 Mening Protein Calendarim</a>

<script>
const SUPABASE_URL = "https://mkqkdmgojxefjctuhlyx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rcWtkbWdvanhlZmpjdHVobHl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTUyMDIsImV4cCI6MjA5NjU3MTIwMn0.tUK3inH0lYxfFennqPMeo_usxvX9JlwECobSmurEat0";

const proteinInput = document.querySelector(".protein-gram");
const dateInput = document.querySelector(".date-consumed");
const result = document.querySelector(".result");
const btn = document.querySelector(".protein-add-button");
const clearBtn = document.querySelector(".clear-button");

const name = localStorage.getItem("userName") || "Foydalanuvchi";
const goal = Number(localStorage.getItem("protein")) || 120;

document.getElementById("welcome").innerHTML = `Xush kelibsiz ${name}!`;
document.getElementById("welcome2").innerHTML = `Sizning kunlik protein ehtiyojingiz: ${goal}g`;

async function saveToSupabase(name, consumed) {
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/protein_logs`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify({ name: name, consumed: consumed })
        });
        if (res.ok) {
            console.log("✅ Supabase ga saqlandi!");
        } else {
            const err = await res.text();
            console.log("❌ Supabase xatolik:", err);
        }
    } catch (e) {
        console.log("❌ Fetch xatolik:", e);
    }
}

function getData() {
    return JSON.parse(localStorage.getItem("proteinData")) || {};
}

function saveData(data) {
    localStorage.setItem("proteinData", JSON.stringify(data));
}

function render() {
    const data = getData();
    result.innerHTML = "";
    for (let date in data) {
        result.innerHTML += `
            <div>${date} - ${data[date].consumed}g / ${data[date].goal}g</div>
        `;
    }
}

async function addProtein() {
    const value = Number(proteinInput.value);
    const date = dateInput.value;

    if (!value || !date) return;

    let data = getData();
    if (!data[date]) {
        data[date] = { consumed: 0, goal: goal };
    }
    data[date].consumed += value;

    saveData(data);
    render();

    await saveToSupabase(name, data[date].consumed + "g");

    proteinInput.value = "";
}

clearBtn.addEventListener("click", function () {
    const ok = confirm("Hamma data o'chiriladi. Rozimisiz?");
    if (!ok) return;
    localStorage.removeItem("proteinData");
    render();
});

btn.addEventListener("click", addProtein);
render();
</script>

</body>
</html>
